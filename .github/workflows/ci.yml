name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Typecheck
        run: python -m mypy
      - name: Tests
        run: python -m pytest -q
      - name: Benchmark (mock mode)
        # The scripted oracle is expected to pass exactly 15 of 20 tasks (75%).
        # A lower rate means the harness, tools or tasks regressed.
        run: python -m mini_agent bench --provider mock --out /tmp/bench-ci --min-pass-rate 0.75 --workers 4 \
          --compare-to bench/results/mock

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t mini-agent .
      - name: Mock benchmark inside the container
        run: docker run --rm mini-agent bench --provider mock --tasks 01_,04_ --out /tmp/results
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sandbox tests against the real image
        run: |
          pip install -e ".[dev]"
          MINI_AGENT_SANDBOX_IMAGE=mini-agent python -m pytest -q tests/test_sandbox.py -rs
          python -m mini_agent bench --sandbox-image mini-agent --tasks 01_,04_,07_ \
            --strategy direct --out /tmp/sandboxed
