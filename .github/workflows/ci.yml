name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Typecheck
        run: python -m mypy
      - name: Tests
        run: python -m pytest -q
      - name: Benchmark (mock mode)
        # The scripted oracle is expected to pass exactly 15 of 20 tasks (75%).
        # A lower rate means the harness, tools or tasks regressed.
        run: python -m mini_agent bench --provider mock --out /tmp/bench-ci --min-pass-rate 0.75
